    <!-- Right: Color controls -->
    <section class="controls-panel" aria-label="Color controls">
      <h2>Customize Colors</h2>

      <div class="color-controls">
        <div class="color-row" data-class="cls-1">
          <label for="pick-background">Background</label>
          <div class="inputs">
            <input type="color" id="pick-background" value="#c65252">
            <input type="text"  id="hex-background"  value="#c65252" maxlength="7" spellcheck="false">
          </div>
        </div>

        <div class="color-row" data-class="cls-4">
          <label for="pick-pennant">Pennant</label>
          <div class="inputs">
            <input type="color" id="pick-pennant" value="#2f4460">
            <input type="text"  id="hex-pennant"  value="#2f4460" maxlength="7" spellcheck="false">
          </div>
        </div>

        <div class="color-row" data-class="cls-2">
          <label for="pick-accent">Accent</label>
          <div class="inputs">
            <input type="color" id="pick-accent" value="#8ebcef">
            <input type="text"  id="hex-accent"  value="#8ebcef" maxlength="7" spellcheck="false">
          </div>
        </div>

        <div class="color-row" data-class="cls-3">
          <label for="pick-text">Text</label>
          <div class="inputs">
            <input type="color" id="pick-text" value="#fffefd">
            <input type="text"  id="hex-text"  value="#fffefd" maxlength="7" spellcheck="false">
          </div>
        </div>
      </div>

      <button id="reset-btn">Reset to Defaults</button>
    </section>
  </main>

  <script src="app.js"></script>
